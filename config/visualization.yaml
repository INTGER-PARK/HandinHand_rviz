# Visualization data generation and geometry settings. No controller tuning.
# Initial display/namespace checkboxes live in rviz/handinhand.rviz.
hih_rviz:
  ros__parameters:
    world_frame: world
    frame_prefix: hih_viz
    output_prefix: /hih_viz
    publish_rate_hz: 30.0
    state_timeout_s: 0.7
    feedback_timeout_s: 0.7
    marker_lifetime_s: 0.4
    drone_state_source: measured  # Optional ground_truth requires an existing external publisher.
    # Cooperation high-fidelity sensor mode: a_W = R_WB * acc + gravity_world.
    # Use world_linear when the simulator's sensor model is disabled.
    acceleration_mode: body_specific_force
    gravity_world: [0.0, 0.0, -9.81]
    state_topic_template: /{role}/minitrone/state
    # INPUTS only. Original CooperationPlant now publishes payload odom/accel.
    # Drone GT inputs remain optional; normal drone display uses measured state.
    # This package never starts a plant or exports its GT.
    ground_truth_odom_topic_template: /hih/ground_truth/{role}/odometry
    ground_truth_acceleration_topic_template: /hih/ground_truth/{role}/acceleration
    command_topic_template: /{role}/minitrone/cmd
    admittance_command_topic_template: /{role}/minitrone/cmd_admittance
    cop_mob_topic_template: /{role}/minitrone/cop_hat
    cop_solver_topic_template: /{role}/minitrone/cop_solver_real
    estimated_wrench_topic_template: /{role}/minitrone/external_wrench_hat_second_order
    contact_wrench_topic_template: /{role}/minitrone/contact_wrench_real
    contact_diagnostics_topic_template: /{role}/minitrone/contact_diagnostics
    payload_wrench_topic: /payload/contact_wrench_from_drones
    payload_face_wrench_topic_template: /payload/contact_wrench_from_{role}
    cop_attitude_node_template: /{role}/{role}_cop_attitude_controller
    cop_translation_node_template: /{role}/{role}_cop_translation_controller
    safety_poll_period_s: 2.0
    # Zero hides a manual boundary. Prefer the live controller parameters above.
    manual_safety_half_y_m: 0.0
    manual_safety_half_z_m: 0.0
    # CoP/wrench OVERLAY frame snapshot: HandinHand_sim 9b1e82e.
    # These do not define the drone model: model geometry comes from MJCF below.
    # Match these to observer/contact frames if the simulator's XML offsets change.
    plate_center_body_m: [0.212, 0.0, 0.0]
    plate_half_size_m: [0.003, 0.2, 0.19]
    contact_face_center_body_m: [0.215, 0.0, 0.0]
    contact_rpy_body_rad: [0.0, 0.0, 0.0]
    payload_size_m: [0.4, 0.5, 0.5]
    # Actual COM plus a heartbeat from the optional payload disturbance node.
    # Enabled here means eligible; no marker appears without both fresh inputs.
    show_payload_com: true
    payload_com_topic: /hih/ground_truth/payload/com
    payload_com_enabled_topic: /hih/disturbance/payload/com_visualization_enabled
    payload_com_diameter_m: 0.03
    payload_com_model_alpha: 0.25  # Reveal the interior only while COM is shown.
    history_max_points: 1000
    history_max_age_s: 120.0
    history_interval_s: 0.05
    history_min_distance_m: 0.005
    velocity_scale: 0.4             # m / (m/s)
    acceleration_scale: 0.08        # m / (m/s^2)
    angular_velocity_scale: 0.15    # m / (rad/s)
    force_scale: 0.04               # m / N
    moment_scale: 0.2               # m / (N*m)
    max_arrow_length_m: 1.2
    show_models: true
    # Empty path resolves hih_plant/xml/Cooperation.xml from the sourced simulator.
    # All original primitive geoms, materials and native servo kinematics are used.
    model_xml_path: ""
    model_geom_groups: [0, 1, 2]  # MuJoCo viewer's default visible geom groups.
    ground_truth_joint_state_topic_template: /hih/ground_truth/{role}/joint_states
    show_axes: true
    show_labels: true  # Publish labels; RViz namespaces start OFF for manual enabling.
    show_kinematics: true
    show_estimated_wrench: true
    show_contact_wrench: true
    show_contact_points: true  # Available diagnostics only; RViz namespace starts OFF.
